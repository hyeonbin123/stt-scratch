name: CI

# push와 pull request마다 린트(ruff)와 테스트(pytest)를 GPU 없이 돌리고(test 작업), 잠금 파일에 고정된 의존성 판을
# 공개 보안 권고와 대조한다(audit 작업).
# 테스트는 작은 무작위 모델로 구조적 성질(미래 누출 없음, 캐시 스트리밍 == 오프라인, 서비스 경로 등)만 보므로
# CPU에서 돈다. CUDA가 필요한 테스트는 테스트 안의 skipif(torch.cuda.is_available())로 건너뛴다.
on:
  push:
  pull_request:

# GITHUB_TOKEN 권한을 저장소 기본값에 맡기지 않고 최소로 둔다. 이 워크플로는 코드를 받아(checkout) 린트·테스트와
# 권고 대조만 하므로 읽기 권한 하나면 되고, 쓰기 권한이 없으면 설치 단계에서 받은 패키지가 잘못된 코드를 실행하더라도
# 토큰으로 저장소를 바꿀 수 없다.
permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest는 2026-10-19부터 Ubuntu 26으로 바뀌므로 러너 이미지를 고정한다(같은 계정의 다른 저장소와 같은 선택).
    runs-on: ubuntu-24.04
    steps:
      # 액션은 태그가 아니라 그 릴리스의 커밋 SHA로 고정한다. 태그는 나중에 다른 커밋으로 옮길 수 있어 같은 워크플로가
      # 다른 코드를 실행할 수 있지만 커밋 SHA는 바뀌지 않는다. 줄 끝 주석이 그 SHA의 릴리스다. 올릴 때는
      # `gh api repos/<소유자>/<저장소>/git/ref/tags/<태그>`로 새 릴리스의 커밋을 조회해 SHA와 주석을 함께 바꾼다
      # (결과의 object.type이 tag면 주석 달린 태그라서, `.../git/tags/<그 sha>`의 object.sha가 커밋이다).
      # persist-credentials: false는 checkout이 끝난 뒤 토큰을 git 인증 설정(.git/config)에 남기지 않는다. 뒤 단계는
      # git으로 원격 저장소에 닿지 않고(테스트·측정 도구가 부르는 git은 rev-parse·status·log 같은 로컬 명령뿐이다), 설치
      # 단계에서 받은 패키지나 테스트가 그 설정에서 토큰을 읽을 일이 없게 한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-uv는 v8부터 움직이는 major 태그를 내지 않으므로 정확한 릴리스(v10.2.0)의 커밋으로 고정한다. v6부터
      # python-version만으로는 가상환경이 켜지지 않아, 아래 uv pip install이 쓸 .venv를 activate-environment로
      # 만든다(uv run도 같은 .venv를 쓴다).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          activate-environment: true
      # uv.lock은 학습용으로 torch·torchaudio를 CUDA 12.8 빌드(+cu128)로 묶는다. 테스트에는 GPU가 필요 없으므로
      # 잠긴 버전과 같은 번호의 CPU 빌드를 PyTorch CPU 색인에서 받고, 나머지 잠긴 패키지는 CUDA 빌드만 쓰는 리눅스
      # 전용 휠(nvidia-*, triton, cuda-*)을 빼고 그대로 설치한다. --locked는 uv.lock이 pyproject.toml과 어긋나면
      # 실패하므로 잠금 파일이 낡은 채로 통과하지 않는다.
      - name: Install
        shell: bash
        run: |
          uv export --locked --no-hashes --no-annotate --no-emit-project --group dev -o "$RUNNER_TEMP/locked.txt"
          grep -E '^(torch|torchaudio)==' "$RUNNER_TEMP/locked.txt" | sed -E 's/\+cu[0-9]+//; s/ *;.*//' > "$RUNNER_TEMP/torch.txt"
          test "$(wc -l < "$RUNNER_TEMP/torch.txt")" -eq 2
          grep -vE '^(torch==|torchaudio==|nvidia-|triton==|cuda-)' "$RUNNER_TEMP/locked.txt" > "$RUNNER_TEMP/rest.txt"
          uv pip install -r "$RUNNER_TEMP/torch.txt" --index-url https://download.pytorch.org/whl/cpu
          uv pip install -r "$RUNNER_TEMP/rest.txt"
          uv pip install --no-deps -e .
      # README의 린트 명령과 같은 범위(src, scripts, tests)를 검사한다. format은 고치지 않고 검사만 한다.
      - name: Lint
        run: |
          uv run --no-sync ruff check src scripts tests
          uv run --no-sync ruff format --check src scripts tests
      - name: Test
        run: uv run --no-sync pytest -q

  # 잠긴 의존성의 공개 보안 권고 대조. uv.lock의 모든 그룹(기본·dev)·모든 플랫폼·모든 파이썬 갈래의 고정 판을 PyPI의
  # 권고 정보(pip-audit 기본 데이터베이스)와 대조한다. 패키지를 설치하지 않고(--disable-pip, --no-deps) 고정된
  # `이름==판`만 보므로, 설치해서 점검할 때처럼 CUDA torch와 nvidia 휠 수 GB를 받지 않는다.
  # - 차단 게이트: continue-on-error를 두지 않는다. 받아들인 권고(아래 목록) 밖의 권고가 하나라도 나오면 이 작업과
  #   워크플로 전체가 실패로 표시된다. 새 권고가 공개된 날부터는 코드와 상관없는 push·PR도 실패하지만, 실패가 전체
  #   성공 표시에 가려지지 않게 하려는 선택이다. 대처는 권고가 걸린 패키지만 올리는 것이다(`uv lock
  #   --upgrade-package <패키지>`, 잠금 파일에서 그 패키지 줄만 바뀜). 측정 경로의 라이브러리(torch·torchaudio·
  #   numpy 등)는 판이 바뀌면 기록 수치를 다시 재야 할 수 있어 바로 올리지 않는다. 그 권고가 이 저장소가 쓰는 방식에
  #   해당하지 않으면 이유를 docs/security.md에 적은 뒤 아래 목록에 더하고, 해당하면 다시 잴 규칙을
  #   docs/experiments.md에 먼저 적은 뒤에 올린다
  # - --locked: test 작업과 같이 uv.lock이 pyproject.toml과 어긋나면 실패해, 낡은 잠금 파일을 대조하고 통과하는 일이
  #   없게 한다
  # - 줄 고르기: uv export 출력에서 패키지 줄만 남기고(첫 글자가 영문·숫자) 환경 표지(`; sys_platform == 'linux'`
  #   등)를 떼어 러너와 상관없이 모든 플랫폼의 항목을 본다. torch·torchaudio의 로컬 판 꼬리(`+cu128`)도 뗀다. 꼬리가
  #   붙은 판은 PyPI에 없어 pip-audit가 'Dependency not found on PyPI'로 건너뛰기만 하고 그 패키지의 권고를 세지
  #   않는다(docs/security.md '다시 돌리는 방법'의 2026-10-29 추가). 꼬리를 떼면 같은 번호의 PyPI 판으로 대조된다.
  #   --strict는 대조하지 못한 패키지가 하나라도 있으면 실패하게 해, 조용히 빠지는 패키지가 없게 한다
  # - 목록 나누기: 같은 이름이 판을 달리해 또 나오면(numpy·networkx처럼 파이썬 3.12 이상에서 다른 판을 고르는 갈래)
  #   pip-audit가 한 목록 안의 같은 이름을 'duplicate requirements' 오류로 거절하므로, 둘째 판부터는 다음
  #   목록(audit-2.txt …)으로 나눠 따로 대조한다. 이름은 PyPI 규칙대로 소문자로 바꾸고 `-`·`_`·`.`을 `-` 하나로 본다
  # - 받아들인 권고(이유는 docs/security.md '재점검 (2026-10-29, Host 허용 목록·의존성 갱신 뒤)'의 pip-audit 항목):
  #   PYSEC-2025-194(torch 2.11.0, CVE-2025-3000: 이 저장소가 쓰지 않는 torch.jit.script의 메모리 손상. torch는 기록
  #   수치를 잰 측정 환경이라 올리지 않는다),
  #   PYSEC-2026-3447·GHSA-xmj3-9gf7-h52w(setuptools 81.0.0: macOS 파일 시스템에서 sdist를 만들 때 제외 규칙이
  #   우회되는 문제와, Windows에서 setuptools의 옛 wheel 설치 경로가 지정한 폴더 밖에 파일을 만드는 문제. 이 저장소는
  #   sdist를 만들지 않고 패키지를 uv로 설치하며 hatchling으로 빌드해 두 경로를 지나지 않는다. 고친 판 83.0.0·84.1.0은
  #   torch 2.11.0+cu128의 요구 `setuptools<82`가 막는다)
  # - pip-audit 판은 고정한다(2.10.1, uvx가 실행할 때 받는다). 대조 결과는 이 단계의 로그에 남는다. 액션은 test 작업과
  #   같은 커밋 SHA다
  audit:
    runs-on: ubuntu-24.04
    # test 작업과 같은 이유로 토큰을 읽기 전용으로 둔다(최상위 permissions를 이 작업에도 분명히 적음).
    # persist-credentials: false도 test 작업과 같은 이유다. 이 작업은 잠금 파일 밖에서 받아 실행하는 도구(uvx로 받는
    # pip-audit)가 있어, 그 도구가 git 인증 설정에서 토큰을 읽을 수 없게 하는 것이 더 중요하다.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # python-version은 uvx가 pip-audit를 돌릴 파이썬을 저장소와 같은 3.11로 정한다(UV_PYTHON). 가상환경은 만들지
      # 않는다(이 작업은 패키지를 설치하지 않는다).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      # shell: bash는 pipefail을 켠다(기본 셸은 bash -e뿐이라 파이프 앞쪽 명령이 실패해도 지나간다). 목록 하나가
      # 실패해도 다음 목록까지 대조해 로그에 모두 남긴 뒤, 하나라도 실패했으면 마지막에 실패로 끝낸다.
      - name: Audit the locked dependencies
        shell: bash
        run: |
          uv export --locked --all-groups --format requirements-txt --no-hashes --no-annotate --no-emit-project > "$RUNNER_TEMP/locked.txt"
          grep -E '^[A-Za-z0-9]' "$RUNNER_TEMP/locked.txt" \
            | sed -E -e 's/[[:space:]]*;.*$//' -e 's/\+[^[:space:]]*$//' > "$RUNNER_TEMP/pinned.txt"
          awk -F'==' -v dir="$RUNNER_TEMP" '{
            name = tolower($1); gsub(/[-_.]+/, "-", name)
            print > (dir "/audit-" (++seen[name]) ".txt")
          }' "$RUNNER_TEMP/pinned.txt"
          status=0
          for list in "$RUNNER_TEMP"/audit-*.txt; do
            echo "== $(basename "$list"): $(wc -l < "$list") packages"
            uvx pip-audit==2.10.1 -r "$list" --no-deps --disable-pip --strict --progress-spinner off \
              --ignore-vuln PYSEC-2025-194 --ignore-vuln PYSEC-2026-3447 --ignore-vuln GHSA-xmj3-9gf7-h52w || status=1
          done
          exit "$status"
