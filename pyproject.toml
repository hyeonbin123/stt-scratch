[project]
name = "stt-scratch"
version = "0.1.0"
description = "Korean speech-to-text model designed and trained from scratch, with a streaming service"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "huggingface-hub>=0.30",
    "jiwer>=4.0",
    "numpy>=2.0",
    "pyarrow>=18",
    "soundfile>=0.13",
    "torch>=2.7",
    "torchaudio>=2.7",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_scratch"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
