<!doctype html>
<!-- [파일 역할] 스트리밍 STT 서버(python -m stt_scratch.service.server)가 GET /으로 내주는 브라우저 -->
<!-- 마이크 클라이언트. 마이크 음성을 16 kHz int16 PCM으로 320 ms마다 WebSocket에 보내고, 서버가 돌려주는 -->
<!-- 부분 자막과 끝점으로 확정된 세그먼트를 보여 준다. -->
<!-- [구조] 스타일(밝은·어두운 색 변수) → 조작 줄(시작·멈춤·상태) → 자막 상자(확정 텍스트 + 진행 중 부분 -->
<!-- 자막) → 측정 표(서버 설정, 보낸 청크 수, 부분 자막 지연, 세그먼트 수, 청크당 계산 시간) → 스크립트. -->
<!-- [보안] 서버가 이 파일의 인라인 스크립트·스타일 블록의 SHA-256 해시만 허용하는 CSP를 붙인다. 해시는 -->
<!-- 서버 시작 때 이 파일에서 계산하므로 내용을 고쳐도 서버만 다시 띄우면 된다. 인라인 style 속성은 CSP가 -->
<!-- 막으므로 쓰지 않는다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stt-scratch 스트리밍 자막</title>
<!-- 스타일 구역: 색은 CSS 변수로 모아 두고 운영체제의 어두운 모드에 맞춰 바꾼다. -->
<style>
  /* 밝은 화면 색 변수: 배경, 글자, 보조 글자, 강조(버튼·부분 자막), 자막 상자 배경. */
  :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6b6b; --accent: #1a4fa0; --box: #f4f4f4; }
  /* 운영체제가 어두운 모드면 같은 변수를 어두운 색으로 덮어쓴다(규칙들은 변수만 참조하므로 다른 곳은 바꿀 */
  /* 필요가 없다). */
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #ececec; --muted: #9a9a9a; --accent: #7aa7ff; --box: #1e1e1e; }
  }
  /* 기본 글꼴은 시스템 글꼴, 없으면 Windows 한글 글꼴(맑은 고딕). */
  body { margin: 0; padding: 16px; font-family: system-ui, "Malgun Gothic", sans-serif; background: var(--bg); color: var(--fg); }
  h1 { font-size: 18px; margin: 0 0 8px; }
  /* 조작 줄: 버튼과 상태 글자를 가로로 놓고 화면이 좁으면 다음 줄로 넘긴다. 비활성 버튼은 흐리게. */
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
  /* 자막 상자: white-space: pre-wrap이라 확정 세그먼트 사이의 줄바꿈 문자가 그대로 줄바꿈으로 보인다. 진행 */
  /* 중 부분 자막(#partial)은 강조색으로 구분한다. */
  #final { background: var(--box); border-radius: 8px; padding: 12px; min-height: 120px; white-space: pre-wrap; line-height: 1.6; font-size: 18px; }
  #partial { color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; }
  table { border-collapse: collapse; font-size: 13px; }
  td { padding: 2px 10px 2px 0; }
  /* 측정 표 위 여백. CSP가 인라인 style 속성을 막아 HTML 속성이 아니라 이 규칙으로 둔다(보안 점검 때 */
  /* 옮김). */
  #metatable { margin-top: 8px; }
</style>
</head>
<body>
<h1>stt-scratch 스트리밍 자막 (로컬 데모)</h1>
<!-- 조작 줄: 마이크 시작(WebSocket 연결 → 마이크 권한 요청 → 전송 시작), 멈춤(남은 음성 전송 → flush → -->
<!-- 연결 종료), 상태 표시. -->
<div class="row">
  <button id="start">마이크 시작</button>
  <button id="stop" disabled>멈춤</button>
  <span class="meta" id="status">대기</span>
</div>
<!-- 자막 상자: 첫 텍스트 노드에 확정된 세그먼트들을 쌓고(스크립트 맨 끝에서 만든다), 그 뒤 span에 지금 -->
<!-- 열린 세그먼트의 부분 자막을 보여 준다. -->
<div id="final"><span id="partial"></span></div>
<!-- 측정 표: 서버 /info의 설정, 보낸 패킷 수, 마지막 부분 자막의 지연(직전 패킷을 보낸 뒤 그 자막을 -->
<!-- 받기까지, 서버 계산 시간 포함), 닫힌 세그먼트 수, 멈춘 뒤 서버가 보내는 청크당 계산 시간 p50·p90. -->
<table class="meta" id="metatable">
  <tr><td>서버 설정</td><td id="info">-</td></tr>
  <tr><td>보낸 청크</td><td id="sent">0</td></tr>
  <tr><td>마지막 부분 자막 지연(보낸 뒤 → 받음)</td><td id="lat">-</td></tr>
  <tr><td>세그먼트</td><td id="seg">0</td></tr>
  <tr><td>청크당 계산 시간(flush 뒤)</td><td id="stats">-</td></tr>
</table>
<p class="meta">320 ms마다 16 kHz PCM을 보내고, 서버는 청크마다 추가된 글자만 돌려줍니다(부분 자막은 수정되지 않음). 끝점 규칙이 켜지면 세그먼트가 닫힙니다.</p>
<!-- 클라이언트 스크립트: 서버 설정 표시, 마이크 → AudioWorklet → 320 ms 패킷 → WebSocket 전송, 서버 -->
<!-- 이벤트 표시, 멈춤 처리. -->
<script>
// 패킷 규격: 320 ms = 16 kHz × 0.32 = 5,120표본(서버의 인코더 청크 8프레임과 같은 길이). 첫 패킷만 240표본을
// 더 보내야 서버 log-mel이 패킷마다 정확히 32프레임(청크 하나)을 만든다(docs/experiments.md 규칙 변경 9).
const CHUNK_MS = 320, RATE = 16000, CHUNK_SAMPLES = RATE * CHUNK_MS / 1000;
const FIRST_SAMPLES = CHUNK_SAMPLES + 240; // the first packet carries the 240 extra samples of one frame window
// 연결·오디오 객체와 화면 상태: 보낸 패킷 수와 송신 시각(지연 표시용), 지금까지 확정된 텍스트, 세그먼트 번호.
let ctx, source, node, ws, sentChunks = 0, sendTimes = [], committed = "", segment = 0;
const $ = id => document.getElementById(id);

// 페이지를 열 때 GET /info로 서버 설정(청크 길이, 좌측 문맥, 장치, rule2 묵음 시간)을 받아 표에 보여 준다.
// 실패해도 페이지는 그대로 쓸 수 있다.
async function loadInfo() {
  try { const r = await fetch("/info"); const j = await r.json();
    $("info").textContent = `청크 ${j.chunk_ms} ms, 좌측 ${j.left_frames}프레임, ${j.device}, 끝점 rule2 ${j.endpoint.rule2_s}s`; } catch (e) {}
}
loadInfo();

// AudioWorklet 프로세서 코드(문자열). 오디오 스레드에서 렌더 단위(보통 128표본)로 들어오는 마이크 표본을 모아
// 첫 패킷은 5,360표본, 이후 5,120표본이 차면 메인 스레드로 넘긴다. 시간이 아니라 표본 수로 세므로 패킷 길이가
// 서버의 규약과 정확히 맞는다. "drain" 메시지를 받으면 남은 표본(320 ms 미만)도 내보낸다. 별도 파일 없이 Blob
// URL로 불러오므로 CSP의 script-src에 blob:이 열려 있다.
const workletCode = `
class PcmSender extends AudioWorkletProcessor {
  constructor() { super(); this.buf = []; this.n = 0; this.limit = ${FIRST_SAMPLES}; this.port.onmessage = () => this.emit(); }
  emit() {
    if (!this.n) return;
    const out = new Float32Array(this.n); let o = 0;
    for (const b of this.buf) { out.set(b, o); o += b.length; }
    this.buf = []; this.n = 0; this.limit = ${CHUNK_SAMPLES}; this.port.postMessage(out, [out.buffer]);
  }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0]; if (!ch) return true;
    this.buf.push(Float32Array.from(ch)); this.n += ch.length;
    if (this.n >= this.limit) this.emit();  // "drain" messages call emit() for the remainder
    return true;
  }
}
registerProcessor("pcm-sender", PcmSender);`;

// Web Audio의 float(−1~1)을 서버가 기대하는 int16 PCM으로 바꾼다. 범위를 넘는 값은 잘라 내고, 음수는 32768,
// 양수는 32767을 곱해 int16 범위를 꽉 채운다.
function floatToInt16(f32) {
  const out = new Int16Array(f32.length);
  for (let i = 0; i < f32.length; i++) { const s = Math.max(-1, Math.min(1, f32[i])); out[i] = s < 0 ? s * 32768 : s * 32767; }
  return out;
}

// 시작: 같은 호스트의 /ws로 WebSocket을 연다(서버는 Origin이 다른 사이트면 연결을 거부한다). 연결이 열리면
// 마이크를 켠다.
$("start").onclick = async () => {
  $("start").disabled = true;
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen = async () => {
    // 모노 마이크를 연다(에코 제거 켬, 잡음 억제 끔).
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: false } });
    // AudioContext를 16 kHz로 열어 브라우저가 마이크 음성을 모델 입력 표본화율로 다시 샘플링하게 한다.
    // 브라우저가 다른 값으로 열면 상태 줄에 경고만 띄운다(서버는 16 kHz로 가정하므로 그대로 보내면 인식이
    // 틀어진다).
    ctx = new AudioContext({ sampleRate: RATE });
    if (ctx.sampleRate !== RATE) { $("status").textContent = `브라우저가 ${ctx.sampleRate} Hz로 열었습니다(16 kHz 필요)`; }
    const blob = new Blob([workletCode], { type: "application/javascript" });
    await ctx.audioWorklet.addModule(URL.createObjectURL(blob));
    source = ctx.createMediaStreamSource(stream);
    node = new AudioWorkletNode(ctx, "pcm-sender");
    // worklet이 넘긴 패킷을 int16으로 바꿔 바이너리 프레임으로 보내고, 송신 시각을 남겨 부분 자막 지연 계산에
    // 쓴다. 연결이 열려 있지 않으면 버린다.
    node.port.onmessage = ev => {
      if (ws.readyState !== 1) return;
      ws.send(floatToInt16(ev.data).buffer);
      sentChunks += 1; sendTimes.push(performance.now()); $("sent").textContent = sentChunks;
    };
    // 마이크 → worklet → 출력 장치로 그래프를 잇는다. worklet은 출력에 아무것도 쓰지 않으므로 소리는 나지
    // 않는다.
    source.connect(node); node.connect(ctx.destination);
    $("status").textContent = "듣는 중"; $("stop").disabled = false;
  };
  // 서버 이벤트 처리. partial: 부분 자막 갱신과 지연 표시(지금 시각 − 마지막 패킷 송신 시각). final: 확정
  // 텍스트에 줄을 바꿔 덧붙이고 부분 자막을 비운다. stats: flush 뒤 세션 전체의 청크당 계산 시간. 빈
  // 세그먼트를 닫는 endpoint 이벤트는 화면에 보여 줄 것이 없어 무시한다.
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "partial") {
      $("partial").textContent = m.text;
      if (sendTimes.length) $("lat").textContent = `${Math.round(performance.now() - sendTimes[sendTimes.length - 1])} ms (계산 ${m.compute_ms} ms)`;
    } else if (m.type === "final") {
      committed += (committed ? "\n" : "") + m.text; segment = m.segment + 1; $("seg").textContent = segment;
      $("final").childNodes[0].nodeValue = committed + "\n"; $("partial").textContent = "";
    } else if (m.type === "stats" && m.chunks) {
      $("stats").textContent = `${m.chunks} chunks, p50 ${m.compute_ms_p50.toFixed(1)} ms, p90 ${m.compute_ms_p90.toFixed(1)} ms`;
    }
  };
  ws.onclose = () => { $("status").textContent = "연결 끊김"; };
};

// 멈춤: worklet에 남은 320 ms 미만 음성을 먼저 보내게 하고(drain), 잠시 뒤 오디오를 끊고 "flush"를 보내
// 서버가 마지막 부분 청크를 처리해 final과 stats를 돌려주게 한다. 그 응답을 받을 시간을 두고 1.5초 뒤 연결을
// 닫는다.
$("stop").onclick = () => {
  $("stop").disabled = true;
  if (node) node.port.postMessage("drain");  // send the buffered remainder (< 320 ms) before flushing
  setTimeout(() => {
    if (node) { node.disconnect(); source.disconnect(); }
    if (ctx) ctx.close();
    if (ws && ws.readyState === 1) { ws.send("flush"); setTimeout(() => ws.close(), 1500); }
  }, 150);
  $("status").textContent = "멈춤"; $("start").disabled = false;
};
// 자막 상자 맨 앞에 빈 텍스트 노드를 하나 넣어 확정 텍스트 자리로 쓴다(final 처리에서 이 노드의 값만 바꾼다).
$("final").insertBefore(document.createTextNode(""), $("partial"));
</script>
</body>
</html>
